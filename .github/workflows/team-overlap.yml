name: Team · пересечения PR

# На каждом PR: метки zone:* по изменённым файлам и один комментарий
# со списком общих файлов с другими открытыми PR (правила — TEAM.md, зоны — .github/team.json).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: team-overlap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  overlap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/team.json
            scripts/team
      - uses: actions/github-script@v7
        with:
          script: |
            const { zonesOf, isHot, isGenerated } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/team/lib.mjs`);
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const filesOf = async (number) =>
              (await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: number, per_page: 100 })).map((f) => f.filename);

            const mine = await filesOf(pr.number);
            const zones = zonesOf(mine);

            // Метки zone:* — синхронизируем с текущим набором файлов
            const wanted = zones.map((z) => `zone:${z}`);
            const current = pr.labels.map((l) => l.name).filter((n) => n.startsWith('zone:'));
            for (const name of current.filter((n) => !wanted.includes(n)))
              await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name }).catch(() => {});
            if (wanted.length) await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: wanted });

            // Пересечения с другими открытыми PR
            const others = (await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 }))
              .filter((p) => p.number !== pr.number);
            const rows = [];
            for (const p of others) {
              const shared = (await filesOf(p.number)).filter((f) => mine.includes(f));
              if (!shared.length) continue;
              const mark = (f) => `\`${f}\`${isGenerated(f) ? ' _(генерируется)_' : isHot(f) ? ' **(горячий)**' : ''}`;
              rows.push(`- #${p.number} «${p.title}» (\`${p.head.ref}\`): ${shared.map(mark).join(', ')}`);
            }

            const marker = '<!-- team-overlap -->';
            const body = [
              marker,
              `### Пересечения с другими PR`,
              `Зоны этого PR: ${zones.join(', ') || '—'}`,
              '',
              rows.length
                ? ['Общие файлы — договоритесь о порядке мержа в PR/issue, второй мержит базу к себе после первого:', ...rows].join('\n')
                : 'Пересечений с открытыми PR нет.',
              '',
              `_Сгенерированные файлы при конфликте не склеивать — \`npm run tokens\`. Правила: [TEAM.md](${context.serverUrl}/${owner}/${repo}/blob/HEAD/TEAM.md)._`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else if (rows.length) await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            core.summary.addRaw(body).write();
