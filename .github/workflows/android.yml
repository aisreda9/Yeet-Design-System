name: Android (Compose)

on:
  push:
    branches: [main]
    paths: ['native/android/**', 'tokens/**', 'src/icons/**', 'scripts/build-tokens.mjs', 'scripts/tokens/**', 'package-lock.json', 'scripts/android.mjs', '.github/workflows/android.yml']
  pull_request: # без фильтра путей: проверка «Android-сборка» обязательна для main, на PR без натива сборка пропускается (job changes)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Новый пуш в PR отменяет устаревший прогон; прогоны main доигрывают до конца
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Затронут ли натив в PR: без этого обязательная проверка «Android-сборка» на PR без натива висела бы вечно (#147)
  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.diff.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != 'pull_request' ]; then echo 'native=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE...$HEAD" | grep -qE '^(native/android/|tokens/|src/icons/|scripts/build-tokens\.mjs$|scripts/tokens/|package-lock\.json$|scripts/android\.mjs$|\.github/workflows/android\.yml$)'; then
            echo 'native=true' >> "$GITHUB_OUTPUT"
          else
            echo 'native=false' >> "$GITHUB_OUTPUT"
            echo '> Натив не затронут — сборка пропущена.' >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Генератор токенов — Style Dictionary (devDependency)
      - run: npm ci
        working-directory: .
      - name: Сгенерированные токены, иконки и шрифты совпадают с источниками (npm run tokens)
        working-directory: .
        run: |
          node scripts/build-tokens.mjs
          git diff --exit-code -- tokens native/android src/tokens
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Библиотека + sample (debug)
        run: ./gradlew :yeet-design-system:assembleDebug :sample:assembleDebug --stacktrace
      - name: Android Lint (библиотека)
        run: ./gradlew :yeet-design-system:lintDebug
      - uses: actions/upload-artifact@v7
        with:
          name: yeet-sample-debug
          path: native/android/sample/build/outputs/apk/debug/*.apk

  # Итог для правил ветки main: зелёный, если сборка прошла или натив не затронут
  result:
    name: Android-сборка
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "changes=$CHANGES build=$BUILD"
          [ "$CHANGES" = success ] || { echo '::error::Не удалось определить, затронут ли натив'; exit 1; }
          case "$BUILD" in success|skipped) ;; *) echo "::error::Сборка Android: $BUILD"; exit 1 ;; esac
