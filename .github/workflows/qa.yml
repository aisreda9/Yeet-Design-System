name: QA Storybook

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build-storybook
      - run: npx playwright-core install --with-deps chromium
      - run: npm run contrast
      - name: QA (тени, края, спеки Figma, доступность, скриншоты)
        run: npm run qa
      - name: Сверка экранов с флоу Figma (тексты, позиции, шрифты, цвета)
        if: always()
        run: npm run flow-diff -- --strict
      - if: always()
        run: cat qa/out/report.md qa/out/flow-diff.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: qa/out
