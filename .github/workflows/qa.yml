name: QA Storybook

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Новый пуш в PR отменяет устаревший прогон; прогоны main доигрывают до конца
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Имена jobs («qa», «Play-тесты историй») — это имена check-runs, которые qa-baseline.yml ставит на коммит эталонов
# вместо повторного прогона. Переименовал job или добавил проверку — поправь и qa-baseline.yml.
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # До build-storybook: он сам перегенерирует токены и скроет ручную правку
      - name: Сгенерированные токены совпадают с tokens/tokens.json (npm run tokens)
        run: |
          node --test scripts/tokens/dtcg.test.mjs
          node scripts/build-tokens.mjs
          if [ -n "$(git status --porcelain -- src/tokens tokens native)" ]; then
            git status --porcelain -- src/tokens tokens native
            git diff --stat -- src/tokens tokens native
            echo '::error::Сгенерированные файлы не совпадают с генератором. Правь tokens/tokens.json или scripts/build-tokens.mjs, затем `npm run tokens` и закоммить результат.'
            exit 1
          fi
      - run: npm run typecheck
      - id: build
        run: npm run build-storybook
      - name: Версия Playwright
        id: pw
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Кэш браузеров Playwright
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright-core install --with-deps chromium
      # Браузер из кэша, но системные библиотеки на чистом раннере ставить всё равно нужно
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright-core install-deps chromium
      - run: npm run contrast
      - name: Переменные Figma «Yeet DS 2.0» против токенов (npm run figma-sync)
        run: npm run figma-sync
      - name: QA (тени, края, спеки Figma, доступность, скриншоты)
        run: npm run qa
      - name: Сверка экранов с флоу Figma (тексты, позиции, шрифты, цвета)
        # И после падения QA, но не когда сборка не дошла до конца — иначе ошибка сборки тонет в ERR_MODULE_NOT_FOUND
        if: always() && steps.build.outcome == 'success'
        run: npm run flow-diff -- --strict
      - name: Покрытие экранов (кадры Figma ↔ истории) и пути story реестра
        # Пробелы покрытия — предупреждение (волна 2 доливает экраны), мёртвый путь в registry.ts — ошибка
        if: always() && steps.build.outcome == 'success'
        run: node scripts/qa/coverage.mjs
      - if: always()
        run: cat qa/out/report.md qa/out/flow-diff.md qa/out/coverage.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-report
          path: qa/out

  play:
    name: Play-тесты историй
    # Каждая история — тест в headless Chromium (vitest + @storybook/addon-vitest); упавший play = красный CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Версия Playwright
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Кэш браузеров Playwright
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Play-тесты (npm run test-storybook)
        run: npm run test-storybook -- --reporter=default --reporter=github-actions
