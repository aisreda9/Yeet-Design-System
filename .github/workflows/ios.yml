name: iOS package

on:
  push:
    branches: [main]
    paths:
      - 'native/ios/**'
      - 'Package.swift'
      - 'tokens/**'
      - 'src/icons/**'
      - 'src/atoms/icon.tsx'
      - 'scripts/build-tokens.mjs'
      - 'scripts/tokens/**'
      - 'package-lock.json'
      - 'scripts/build-ios.mjs'
      - '.github/workflows/ios.yml'
  pull_request: # без фильтра путей: проверка «iOS-сборка» обязательна для main, на PR без натива сборка пропускается (job changes)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Новый пуш в PR отменяет устаревший прогон; прогоны main доигрывают до конца
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Затронут ли натив в PR: без этого обязательная проверка «iOS-сборка» на PR без натива висела бы вечно (#147)
  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.diff.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != 'pull_request' ]; then echo 'native=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE...$HEAD" | grep -qE '^(native/ios/|Package\.swift$|tokens/|src/icons/|src/atoms/icon\.tsx$|scripts/build-tokens\.mjs$|scripts/tokens/|package-lock\.json$|scripts/build-ios\.mjs$|\.github/workflows/ios\.yml$)'; then
            echo 'native=true' >> "$GITHUB_OUTPUT"
          else
            echo 'native=false' >> "$GITHUB_OUTPUT"
            echo '> Натив не затронут — сборка пропущена.' >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Генератор токенов — Style Dictionary (devDependency)
      - run: npm ci
      - name: Сгенерированные файлы актуальны (npm run tokens)
        run: |
          node scripts/build-tokens.mjs
          git status --porcelain -- native/ios tokens src/tokens
          test -z "$(git status --porcelain -- native/ios tokens src/tokens)" || { echo '::error::Run `npm run tokens` and commit the result'; exit 1; }
      - name: Xcode
        run: xcodebuild -version && swift --version
      - name: Build native/ios (iOS Simulator)
        working-directory: native/ios
        run: xcodebuild build -scheme YeetDesignSystem -destination 'generic/platform=iOS Simulator' -quiet
      - name: Build root manifest (SPM by repository URL)
        run: xcodebuild build -scheme YeetDesignSystem -destination 'generic/platform=iOS Simulator' -quiet

  # Итог для правил ветки main: зелёный, если сборка прошла или натив не затронут
  result:
    name: iOS-сборка
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "changes=$CHANGES build=$BUILD"
          [ "$CHANGES" = success ] || { echo '::error::Не удалось определить, затронут ли натив'; exit 1; }
          case "$BUILD" in success|skipped) ;; *) echo "::error::Сборка iOS: $BUILD"; exit 1 ;; esac
