name: iOS package

on:
  push:
    branches: [main]
    paths:
      - 'native/ios/**'
      - 'Package.swift'
      - 'tokens/**'
      - 'src/icons/**'
      - 'src/atoms/icon.tsx'
      - 'scripts/build-tokens.mjs'
      - 'scripts/build-ios.mjs'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'native/ios/**'
      - 'Package.swift'
      - 'tokens/**'
      - 'src/icons/**'
      - 'src/atoms/icon.tsx'
      - 'scripts/build-tokens.mjs'
      - 'scripts/build-ios.mjs'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Генератор использует только встроенные модули Node — npm ci не нужен
      - name: Сгенерированные файлы актуальны (npm run tokens)
        run: |
          node scripts/build-tokens.mjs
          git status --porcelain -- native/ios tokens src/tokens
          test -z "$(git status --porcelain -- native/ios tokens src/tokens)" || { echo '::error::Run `npm run tokens` and commit the result'; exit 1; }
      - name: Xcode
        run: xcodebuild -version && swift --version
      - name: Build native/ios (iOS Simulator)
        working-directory: native/ios
        run: xcodebuild build -scheme YeetDesignSystem -destination 'generic/platform=iOS Simulator' -quiet
      - name: Build root manifest (SPM by repository URL)
        run: xcodebuild build -scheme YeetDesignSystem -destination 'generic/platform=iOS Simulator' -quiet
